[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgecalc"
version = "1.1.0"
description = "Bridge traffic loads and checks: AASHTO HL-93 envelopes on simple and continuous spans by influence lines, EN 1991-2 LM1/LM2, IAP-11, distribution factors, LRFR load rating, AASHTO and EN 1990 combinations, box girders, EN 1998-2 ductility, pier pushover, fragility, grillage for SAP2000, Revit/AutoCAD export, REST API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["bridge", "bridge-engineering", "aashto-lrfd", "hl-93", "en-1991-2", "iap-11", "load-rating", "lrfr", "influence-lines", "continuous-beam", "box-girder", "eurocode", "ec8", "pier-pushover", "fragility", "seismic", "structural-engineering", "loadpath"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "httpx>=0.27"]
dxf = ["ezdxf>=1.0"]
memos = ["handcalcs>=1.6"]
test = ["pytest>=8", "pytest-timeout>=2.2"]

[project.urls]
Homepage = "https://github.com/jmurgass99/bridgecalc"
Repository = "https://github.com/jmurgass99/bridgecalc"
Issues = "https://github.com/jmurgass99/bridgecalc/issues"

[tool.setuptools.packages.find]
include = ["bridgecalc*"]

[tool.setuptools.package-data]
bridgecalc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lentos",
    "integration: integración entre módulos",
    "api: endpoints REST",
    "live: requiere software comercial en vivo (SAP2000, Revit)",
]
